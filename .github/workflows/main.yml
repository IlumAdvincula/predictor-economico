name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar carpeta web para Android
        run: |
          mkdir -p www
          # Copiar archivos desde Antigravity Projects o raíz
          if [ -d "Antigravity Projects" ]; then
            cp -r "Antigravity Projects"/index.html www/
            cp -r "Antigravity Projects"/css www/ 2>/dev/null || true
            cp -r "Antigravity Projects"/js www/ 2>/dev/null || true
          else
            cp -r index.html css js www/ 2>/dev/null || true
          fi

      - name: Instalar Capacitor y crear proyecto Android
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Predictor Economico" "com.pedro.predictoreconomico" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: PredictorEconomico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
