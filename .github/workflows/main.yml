name: Compilar para Android, Windows y Mac

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 1. COMPILACIÓN ANDROID (.apk)
  android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Preparar archivos
        run: |
          mkdir -p www
          if [ -d "Antigravity Projects" ]; then
            cp -r "Antigravity Projects"/index.html www/
            cp -r "Antigravity Projects"/css www/ 2>/dev/null || true
            cp -r "Antigravity Projects"/js www/ 2>/dev/null || true
          else
            cp -r index.html css js www/ 2>/dev/null || true
          fi
      - name: Instalar Capacitor y compilar
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Predictor Economico" "com.pedro.predictoreconomico" --web-dir www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 1-App-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 2. COMPILACIÓN WINDOWS (.exe)
  windows:
    name: Compilar Ejecutable Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias y compilar .exe
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter matplotlib numpy pillow
          TARGET_DIR="."
          [ -d "Antigravity Projects" ] && TARGET_DIR="Antigravity Projects"
          cd "$TARGET_DIR"
          pyinstaller --noconfirm --onedir --windowed --name "PredictorEconomico-Windows" desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: 2-App-Windows-EXE
          path: "**/dist/PredictorEconomico-Windows/**"

  # 3. COMPILACIÓN MAC OS (.app)
  macos:
    name: Compilar Aplicación macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias y compilar .app
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller customtkinter matplotlib numpy pillow
          TARGET_DIR="."
          [ -d "Antigravity Projects" ] && TARGET_DIR="Antigravity Projects"
          cd "$TARGET_DIR"
          pyinstaller --noconfirm --onedir --windowed --name "PredictorEconomico-Mac" desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: 3-App-MacOS
          path: "**/dist/PredictorEconomico-Mac.app"
